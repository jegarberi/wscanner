server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # La cámara y los sensores necesitan contexto seguro (https) en el celular
    add_header Permissions-Policy "camera=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
    }
}
