server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root  /usr/share/nginx/html;
    index index.html;

    # La cámara y los sensores necesitan contexto seguro (https) en el celular
    add_header Permissions-Policy "camera=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
    add_header X-Content-Type-Options nosniff always;

    # Fotogramas del escáner: se reenvían al servicio «uploads» (red interna de compose)
    resolver 127.0.0.11 valid=30s;
    location /upload/ {
        set $uploads http://uploads:8080;
        proxy_pass $uploads;
        client_max_body_size 8m;
        proxy_request_buffering off;
    }

    # Modelos: solo el listado de sesiones y splat.ply; los fotogramas y el manifiesto no se sirven
    location = /captures/ { autoindex on; autoindex_format json; }
    location ~ ^/captures/[^/]+/$ { autoindex on; autoindex_format json; }
    location ~ ^/captures/[^/]+/splat\.ply$ { }
    location /captures/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
    }
}
