services:
  scanner3d:
    build: .
    image: scanner3d:latest
    container_name: scanner3d
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8085}:80"
      - "${HTTPS_PORT:-8448}:443"
    environment:
      # IP de este equipo en tu red local, para incluirla en el certificado (opcional)
      SERVER_IP: ${SERVER_IP:-}
      SERVER_NAME: ${SERVER_NAME:-scanner3d.local}
    volumes:
      # Certificados persistentes. Pon aquí cert.pem y key.pem propios si los tienes.
      - ./certs:/etc/nginx/certs

  uploads:
    image: python:3.12-alpine
    container_name: scanner3d-uploads
    restart: unless-stopped
    command: ["python", "/app/server.py"]
    # GPU del host (RTX 3090). Requiere NVIDIA Container Toolkit instalado en el host.
    gpus: all
    environment:
      DATA_DIR: /data
    volumes:
      - ./uploads:/app:ro
      # Fotogramas subidos desde el celular (una carpeta por sesión)
      - ./captures:/data
